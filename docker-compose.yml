# Simplified docker-compose for easy deployment
services:
  deepfake-detector:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: deepfake-detector-app
    ports:
      - "3000:3000"  # Frontend
      - "8000:8000"  # Backend API
    environment:
      - TRAINING_MODE=false
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://ffalathel-deepfake-detector.hf.space
    volumes:
      # Mount models directory for easy model updates
      - ./backend/models:/app/backend/models:ro
      # Mount logs directory for persistence
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "https://ffalathel-deepfake-detector.hf.space/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
