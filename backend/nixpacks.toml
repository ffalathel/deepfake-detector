[phases.setup]
nixPkgs = ["python311", "gcc", "g++", "libgl1", "libglib2.0-0", "libsm6", "libxext6", "libxrender1", "libgomp1", "libgcc-s1", "libstdc++6", "libc6"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Build phase complete'"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
